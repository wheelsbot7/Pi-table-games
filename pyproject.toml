[project]
name = "hand-tracker"
version = "0.2.0"
description = "Hand tracking using OpenCV and MediaPipe with PyGame integration"
authors = [{ name = "Owen Wertzberger", email = "o.wertzberger@gmail.com" }]
dependencies = [
  "opencv-python>=4.8.0",
  "mediapipe>=0.10.0",
  "pygame>=2.5.0",
  "numpy>=1.24.0",
]
requires-python = "==3.12.*"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
hand-tracker = "hand_tracker.tracker:main"
hand-game = "hand_tracker.game:main"
